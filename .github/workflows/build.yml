# Builds and tests LlamaTree on Windows, Linux and macOS, and keeps a self-contained build of each as the run's
# artifacts, with a Mac disk image of each Mac build, signed ad hoc. Releases (signed and notarized) are made by
# azure-pipelines.yml, not here.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            framework: net10.0-windows
            rid: win-x64
          - os: ubuntu-latest
            framework: net10.0
            rid: linux-x64
          - os: macos-latest      # Apple silicon
            framework: net10.0
            rid: osx-arm64
          - os: macos-15-intel    # Intel
            framework: net10.0
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Front-end libraries
        run: npm ci
        working-directory: web

      - name: Test
        run: dotnet test tests/LlamaTree.Tests --logger "console;verbosity=normal"

      - name: Publish
        run: dotnet publish src/LlamaTree/LlamaTree.csproj -f ${{ matrix.framework }} -c Release -r ${{ matrix.rid }} --self-contained true -p:DebugType=None -o artifacts/LlamaTree-${{ matrix.rid }}

      - uses: actions/upload-artifact@v6
        with:
          name: LlamaTree-${{ matrix.rid }}
          path: artifacts/LlamaTree-${{ matrix.rid }}
          retention-days: 14

      # The Mac app and its disk image, as a release makes them but signed ad hoc (a release signs them with our
      # Developer ID and notarizes them: azure-pipelines.yml).
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: tools/package-macos.sh artifacts/LlamaTree-${{ matrix.rid }} 0.0.0 ${{ matrix.rid == 'osx-arm64' && 'arm64' || 'x64' }} artifacts/macos

      # The program in the disk image runs: an ad-hoc signature turns on the hardened runtime too, so .NET running under
      # the app's entitlements is tried here. The session host, given 20 seconds (SIGALRM, 142, means it was still
      # running), or ending by itself with no window to wait for; a crash is anything else.
      - name: Run the packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          mount="$RUNNER_TEMP/llamatree-dmg"
          mkdir -p "$mount" "$RUNNER_TEMP/llamatree-data"
          # diskutil image on macOS 27 and later, where hdiutil attach and detach are deprecated; hdiutil before.
          if diskutil image --help >/dev/null 2>&1; then
            diskutil image attach --readOnly --nobrowse --mountPoint "$mount" "$PWD"/artifacts/macos/LlamaTree-0.0.0-macos-*.dmg
          else
            hdiutil attach artifacts/macos/LlamaTree-0.0.0-macos-*.dmg -nobrowse -readonly -mountpoint "$mount"
          fi
          codesign --verify --deep --strict "$mount/LlamaTree.app"
          set +e
          LLAMATREE_DATA="$RUNNER_TEMP/llamatree-data" perl -e 'alarm 20; exec @ARGV' "$mount/LlamaTree.app/Contents/MacOS/LlamaTree" --host
          code=$?
          set -e
          if diskutil image --help >/dev/null 2>&1; then diskutil eject "$mount"; else hdiutil detach "$mount"; fi
          echo "Exit code $code"
          [ "$code" = 0 ] || [ "$code" = 142 ]

      - uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: LlamaTree-${{ matrix.rid }}-dmg
          path: artifacts/macos/*.dmg
          retention-days: 14
